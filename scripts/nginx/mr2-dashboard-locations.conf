root /var/www/mr2-dashboard;
index index.html;

location / {
  try_files $uri /index.html;
}

location /xbee-ws {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
}

location /video-ws {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
}

location /video/streams {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /latency/time {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /latency/clock-status {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /latency/uplink/ {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_request_buffering off;
  client_max_body_size 256m;
}

location /transitive/token {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /rocket-m2/status {
  proxy_pass http://mr2_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /rosbridge-ws {
  proxy_pass http://mr2_rover_rosbridge/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
}

location /tiles/ {
  alias /var/www/mr2-tiles/;
  try_files $uri =404;
  access_log off;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
}
