server {
  listen 80;
  listen [::]:80;
  server_name base;

  root /var/www/mr2-dashboard;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /sik-ws {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /transitive/token {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /rosbridge-ws {
    proxy_pass http://rover.local:9090/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
