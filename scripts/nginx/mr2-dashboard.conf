upstream mr2_gateway {
  server 127.0.0.1:8081;
}

upstream mr2_rover_rosbridge {
  server 192.168.1.102:9090;
}

# Static network map:
# - base:          192.168.1.101
# - rover:         192.168.1.102
# - base-rocket:   192.168.1.100
# - drone-rocket:  192.168.1.103
# - rover-rocket:  192.168.1.106
server {
  listen 80;
  listen [::]:80;
  server_name base base.local 192.168.1.101;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name base base.local 192.168.1.101;

  ssl_certificate /etc/nginx/ssl/mr2-dashboard.crt;
  ssl_certificate_key /etc/nginx/ssl/mr2-dashboard.key;

  include /etc/nginx/snippets/mr2-dashboard-locations.conf;
}
