upstream mr2_gateway {
  server 127.0.0.1:8081;
}

upstream mr2_rover_rosbridge {
  server 192.168.1.102:9090;
}

# Static network map:
# - base:          192.168.1.101
# - rover:         192.168.1.102
# - base-rocket:   192.168.1.100
# - drone-rocket:  192.168.1.103
# - rover-rocket:  192.168.1.106
server {
  listen 80;
  listen [::]:80;
  server_name base 192.168.1.101;

  root /var/www/mr2-dashboard;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /xbee-ws {
    proxy_pass http://mr2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /video-ws {
    proxy_pass http://mr2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /video/streams {
    proxy_pass http://mr2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /transitive/token {
    proxy_pass http://mr2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /rocket-m2/status {
    proxy_pass http://mr2_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /rosbridge-ws {
    proxy_pass http://mr2_rover_rosbridge/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /tiles/ {
    alias /var/www/mr2-tiles/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
