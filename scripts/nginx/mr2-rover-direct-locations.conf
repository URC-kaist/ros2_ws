root /var/www/mr2-dashboard;
index index.html;

location / {
  try_files $uri /index.html;
}

location /xbee-ws {
  proxy_pass http://mr2_direct_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 1h;
}

location /video-ws {
  proxy_pass http://mr2_direct_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 1h;
}

location = /video/streams {
  proxy_pass http://mr2_direct_gateway;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /rosbridge-ws {
  proxy_pass http://mr2_direct_rosbridge/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 1h;
}
