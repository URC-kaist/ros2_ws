# Modification of:
#  /opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml
# Removd parameters for nodes not launched in this package.

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 2.0
    failure_tolerance: 0.3 # seconds
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # better than simple
      required_movement_radius: 0.001     # almost 0
      required_movement_angle: 0.001      # almost 0

    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker" # better than simple
      xy_goal_tolerance: 1.4
      yaw_goal_tolerance: 3.2
      stateful: True

    # RPP + Rotation shim controller parameters
    FollowPath: # recognized by bt_xml
      # Rotation shim controller parameters
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 1.57079633 # 90 deg
      rotate_to_heading_angular_vel: 1.4 # rad/s
      # RPP parameters
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      transform_tolerance: 0.1
      desired_linear_vel: 1.4 # max linear velocity
      max_angular_accel: 3.2 # shared with rotation shim
      approach_velocity_scaling_dist: 1.0 # near-goal deceleration distance
      min_approach_linear_velocity: 0.05 # near-goal speed clip bottom
      # heading heuristic; instead use rotation shim controller
      use_rotate_to_heading: false
      allow_reversing: false
      # lookahead distance and lookahead gain
      lookahead_dist: 4.2 # baseline
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 3.0 # lookahead gain; two seconds in the future
      min_lookahead_dist: 2.1 # clip bottom
      max_lookahead_dist: 8.4 # clip top
      # proximity heuristic
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 2.0
      cost_scaling_gain: 0.5 # [0, 1], quicker deceleration closer to 0
      # curvature heuristic
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9 # trigger heuristic
      regulated_linear_scaling_min_speed: 0.25 # clip bottom
      # collision avoidance heurstic
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0 # check collision
      min_distance_to_obstacle: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.4, 0.0, 1.4] # check linear_vel, angular_vel
    min_velocity: [0.0, 0.0, -1.4] # also vy = 0 for non-holonomic
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0 # refer bt xml
    use_sim_time: True
    planner_plugins: ["Smac2D"]
    Smac2D: # recognized by bt_xml
      plugin: "nav2_smac_planner/SmacPlanner2D"
      allow_unknown: true
      max_planning_time: 0.5 # refer expected_planner_frequency
      cost_travel_multiplier: 2.0 # how much to avoid cost

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["SGSmoother"]
    SGSmoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      refinement_num: 3

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the nav2.launch.py file & provide full path to map below.
    yaml_filename: ""

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 5.0 # internal calc
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.1 # m/px pc2_to_heightmap.py (0.5 m/px) 와 무관히 조절 가능...
      footprint_padding: 0.01  # 로봇 형상 패딩 (m)
      footprint: "[[0.6, 0.48], [0.6, -0.48], [-0.6, -0.48], [-0.6, 0.48]]"
      plugins:
        - "traversability_layer"
        - "inflation_layer"
      traversability_layer:
        plugin: "mr2_rover_auto/GridMapTraversabilityLayer"
        enabled: true
        grid_map_topic: /traversability_gridmap
        layer: traversability
        min_value: 0.0
        max_value: 1.0
        invert: false
        unknown_cost: 0
        lethal_threshold: 1.0
        flip_x: true
        flip_y: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 3.0
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.3
      update_frequency: 10.0 # internal calc
      publish_frequency: 5.0
      use_maximum: true # superimpose method
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # resolution: follow map resolution from map.yaml
      footprint_padding: 0.01  # 로봇 형상 패딩 (m)
      footprint: "[[0.6, 0.48], [0.6, -0.48], [-0.6, -0.48], [-0.6, 0.48]]"
      track_unknown_space: false
      plugins:
        - "traversability_layer"
        - "static_layer"
        - "inflation_layer"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        footprint_clearing_enabled: true
      traversability_layer: # TODO: integrate traversability map
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /traversability_occupancy # OccupancyGrid
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 3.0 # keep in mind with pixel width
      always_send_full_costmap: False # False = delta updates, True = full costmap

waypoint_follower: # multi-goal, could be useful for cover vision mission?
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

