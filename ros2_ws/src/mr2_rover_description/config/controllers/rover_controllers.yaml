#     cmd_vel_topic: /cmd_vel

manipulator_controller:
  ros__parameters:
    joints:
      - arm_j1
      - arm_j2
      - arm_j3
      - arm_j4
      - arm_j5
      - arm_j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
