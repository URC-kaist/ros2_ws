bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4 # TODO: For Cover Vision, we need to stop in front of the object.
      yaw_goal_tolerance: 0.25
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 6.0 # MPPI; > v_max * N * dt
    FollowPath: # MPPI
      # https://github.com/ros-navigation/navigation2/tree/main/nav2_mppi_controller
      plugin: "nav2_mppi_controller::MPPIController"
      visualize: false # expensive visualization; /trajectories
      time_steps: 56
      model_dt: 0.05
      prune_distance: 6.0 # MPPI: > v_max * N * dt
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.4
      vx_min: -0.35
      vy_max: 0.4
      wz_max: 1.0
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Option to replace Cost and use Obstacles instead
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        cost_scaling_Factor: 1.9386 # match costmap's last inflation layer
        inflation_radius: 3.6 # match costmap's last inflation layer
      # CostCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 3.81
      #   critical_cost: 300.0
      #   consider_footprint: true
      #   collision_cost: 1000000.0
      #   near_goal_distance: 1.0
      #   trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0 # internal computation
      publish_frequency: 1.0 # nav2 etc
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 12 # > prune_distance * 2
      height: 12
      resolution: 0.1 # follow pc2_to_heightmap resolution
      map_vis_z: -0.235
      track_unknown_space: false  
      footprint: "[[0.6, 0.6], [0.6, -0.6], [-0.6, -0.6], [-0.6, 0.6]]"
      plugins: ["traversability_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.9386 # 128 = 253 * e ^ (-f *(1.2-r_i)); r_i = r_c = 0.8485
        inflation_radius: 3.6 # > r_c = 1.2 * sqrt(2) = 0.8485
      traversability_layer:
        plugin: "mr2_nav2_plugins::TraversabilityLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_private_costmap: false # topic: /traversability_private (always)
        clearable: true
        gridmap_topic: "/traversability_gridmap"
        gridmap_layer: "traversability"
        rectangle_frame: rgbd_camera # frame of /rgbd_camera/depth/color/points
        x_forward_m: 3.0
        y_width_m: 4.0
        use_maximum: true # false then overwrite
        persistence_mode: max # options: ema, max, overwrite
        ema_alpha: 0.1 # for persistence_mode = ema (SLAM style catography)
        tf_timeout: 0.2
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0 # internal computation
      publish_frequency: 1.0 # nav2 etc
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.6, 0.6], [0.6, -0.6], [-0.6, -0.6], [-0.6, 0.6]]"
      resolution: 0.4 # follow map0p4.yaml resolution
      map_vis_z: -0.47
      track_unknown_space: true
      plugins: ["static_layer", "traversability_layer", "inflation_layer"]
      traversability_layer:
        plugin: "mr2_nav2_plugins::TraversabilityLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_private_costmap: false # topic: /traversability_private (always)
        clearable: true
        gridmap_topic: "/traversability_gridmap"
        gridmap_layer: "traversability"
        rectangle_frame: rgbd_camera # frame of /rgbd_camera/depth/color/points
        x_forward_m: 3.0
        y_width_m: 4.0
        use_maximum: true # false then overwrite
        persistence_mode: max # options: ema, max, overwrite
        ema_alpha: 0.05 # for persistence_mode = ema (SLAM style fading)
        tf_timeout: 0.2
      static_layer: # https://docs.nav2.org/configuration/packages/costmap-plugins/static.html
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        subscribe_to_updates: True
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.9386 # 128 = 253 * e ^ (-f *(1.2-r_i)); r_i = r_c = 0.8485
        inflation_radius: 10.0 # > r_c = 1.2 * sqrt(2) = 0.8485
      always_send_full_costmap: False

map_server: # https://docs.nav2.org/configuration/packages/map_server/configuring-map-server.html
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "package://mr2_rover_auto/maps/map0p4.yaml"

