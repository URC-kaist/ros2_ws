cover_vision_server:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    base_frame: base_link
    tf_timeout_sec: 0.2
    coverage_path_topic: cover_vision/coverage_path
    navigate_action_name: navigate_to_pose
    navigate_through_poses_action_name: navigate_through_poses
    follow_path_action_name: follow_path
    follow_path_controller_id: FollowPath
    follow_path_goal_checker_id: general_goal_checker

    # Spiral coverage tuning
    spiral_pitch_m: 2.4 # <3.0
    spiral_point_spacing_m: 1.2
    spiral_max_points: 5000

    # Detection handling
    detection_stale_sec: 0.75
    detection_pose_topic: cover_vision/object_pose # deprecated legacy topic
    detection_pose_topic_aruco: cover_vision/object_pose/aruco
    detection_pose_topic_yolo: cover_vision/object_pose/yolo

cover_vision_yolo_adapter:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    mission_status_topic: mission_status
    output_topic: cover_vision/object_pose/yolo
    yolo_pose_topic_prefix: yolo/object_pose
    force_enable: false
    forced_class_id: 0
    tf_timeout_sec: 0.2
    min_publish_interval_sec: 0.1
    filter_window: 5
    max_jump_m: 2.0

cover_vision_aruco_adapter:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    mission_status_topic: mission_status
    output_topic: cover_vision/object_pose/aruco
    aruco_detections_topic: aruco_detections
    prefer_boards: true
    preferred_board_name: aruco_post
    preferred_marker_id: -1
    tf_timeout_sec: 0.2
    min_publish_interval_sec: 0.1
    filter_window: 5
    max_jump_m: 2.0
    force_enable: false
