# https://www.intel.com/content/www/us/en/products/sku/190004/intel-realsense-depth-camera-d435i/specifications.html

pc2_to_heightmap:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /rgbd_camera/depth/color/points
    output_topic: /height_gridmap
    base_frame: base_link
    map_frame: base_link # Use base_link so the grid rotates with the robot; grid_map filters drop orientation.
    x_forward_m: 3.0
    y_width_m: 4.0
    resolution: 0.1
    layer_name: elevation
    voxel_size_m: 0.01
    roi_z_max_m: 3.0
    publish_rate_hz: 6.0 # Follow D435i
    height_rank: 5 # std:nth_rank for binning

grid_map_filters:
  ros__parameters:
    use_sim_time: true
    gravity_source: tf
    gravity_reference_frame: map
    gravity_target_frame: base_link

    algorithm: area
    parallelization_enabled: false # true for CPU multi-core

    # ───── I/O 토픽 ───────────────────────────
    input_topic:  /height_gridmap
    output_topic: /traversability_gridmap

    # ───── 필터 체인 ──────────────────────────
    filters:

      filter1:
        name: buffer_normalizer
        type: gridMapFilters/BufferNormalizerFilter

      filter2:  # Removes nan by inpaint operation (basically interpolation)
        name: inpaint
        type: gridMapCv/InpaintFilter
        params:
          input_layer:  elevation
          output_layer: elevation_inpainted
          radius: 0.4

      filter3:  # 반경 평균화로 노이즈 저감
        name: mean_in_radius
        type: gridMapFilters/MeanInRadiusFilter
        params:
          input_layer:  elevation_inpainted
          output_layer: elevation_smooth
          radius: 0.4

      filter4:  # 표면 법선 벡터 계산
        name: surface_normals
        type: gridMapFilters/NormalVectorsFilter
        params:
          input_layer:              elevation_inpainted
          output_layers_prefix:     normal_vectors_
          radius:                   0.2
          normal_vector_positive_axis: z

      filter5:  # 법선 벡터를 색상으로 시각화
        name: normal_color_map
        type: gridMapFilters/NormalColorMapFilter
        params:
          input_layers_prefix: normal_vectors_
          output_layer:       normal_color

      filter6:  # 경사도(slope) 계산
        name: slope
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: slope
          # EigenLab supports element-wise acos; slope is angle to gravity "up".
          expression: acos(normal_vectors_x .* gravity_x + normal_vectors_y .* gravity_y + normal_vectors_z .* gravity_z)

      filter7:  # 거칠기(roughness) 계산
        name: roughness
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: roughness
          # NOTE: Tune in Field
          expression: abs(elevation_inpainted - elevation_smooth)

      filter8:  # 통행 가능도(traversability) 계산
        name: traversability
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: traversability # NOTE: tune for real (#34)
          # We define step obstructiveness as a criteria for lethal obstacle:
          # slope: >0.5 radian is lethal (if roughness >0.1). roughness: >0.1 is lethal.
          expression: "0 .* cwiseMax( (2.0 ./ (1 + exp(-50 * (slope - 0.5)))) .* (1.0 ./ (1 + exp(-200 * (roughness - 0.1)))) , 2.0 ./ (1 + exp(-50 * (roughness - 0.1))) )"

      filter9:  # 하한(0) 클램핑
        name: traversability_lower_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer:           traversability
          lower_threshold: 0.0
          set_to:          0.0

      filter10:  # 상한(1) 클램핑
        name: traversability_upper_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer:           traversability
          upper_threshold: 1.0
          set_to:          1.0

gridmap_to_occupancy:
  ros__parameters:
    use_sim_time: true
    input_topic: /traversability_gridmap
    output_topic: /traversability_occupancy
    layer: traversability
    min_value: 0.0
    max_value: 1.0
    invert: true
    unknown_value: 0

gridmap_to_pointcloud:
  ros__parameters:
    use_sim_time: true
    input_topic: /traversability_gridmap
    output_topic: /traversability_cloud
    layer: traversability
    # TODO: configure on how to translate traversability as height.
