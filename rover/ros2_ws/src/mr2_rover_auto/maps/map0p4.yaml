# Consult gdalinfo for the map's origin and resolution.
image: "map0p4_slope_length_norm.png"  # Grayscale PNG (0~255)
resolution: 0.4 # m/px
origin: [-500.0, -500.0, 0.0] # image (width, height) * res / 2
negate: 1             # 1 = Black is free in .png
occupied_thresh: 0.65 # 100 (occupied) if >= occupied_thresh
free_thresh: 0.0196   # 0 (free) if <= free_thresh
mode: "scale"         # Grayscale -> Probability scale (0.0~1.0)