# mr2_rover_description/config/controllers/rover_controllers.yaml
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 50

    rover_controller:
      type: mr2_rover_control/TwistToCommandsController

    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

rover_controller:
  ros__parameters:
    wheel_joints:
      - fl_wheel_joint
      - fr_wheel_joint
      - rl_wheel_joint
      - rr_wheel_joint
    steering_joints:
      - fl_steering_joint
      - fr_steering_joint
      - rl_steering_joint
      - rr_steering_joint
    wheel_base: 0.95386
    track_width: 0.6504
    wheel_radius: 0.125
    max_steer: 2.35619  # +/- 135 degrees
    solver_error_alpha: 0.8   # EMA factor for steering cmd; Lower = More "Memory" (#34)
    solver_gain_k: 4.0        # EMA weight sharpness; Higher = more responsive to error magnitude (#34)
    solver_cmd_deadzone_lin: 0.001  # m/s
    solver_cmd_deadzone_ang: 0.001  # rad/s
    solver_vel_eps: 0.0001          # m/s
    twist_timeout: 0.5
    odom_publish_rate_hz: 30.0
    wheel_odom_topic: /wheel_encoder/odometry
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_topic: /cmd_vel

manipulator_controller:
  ros__parameters:
    joints:
      - arm_j1
      - arm_j2
      - arm_j3
      - arm_j4
      - arm_j5
      - arm_j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
