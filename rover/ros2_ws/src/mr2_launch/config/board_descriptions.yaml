# ArUco 4x4_50 single-marker board for the 3-sided post.
# Cells are ~2.5 cm with 1-cell white border => marker side ≈ 15 cm.
# If the printed tag is scaled differently, update marker_size (meters).
- name: aruco_post
  first_id: 0        # use marker ID 0 on all faces
  markers_x: 1
  markers_y: 1
  marker_size: 0.15  # 15 cm total size including 1-cell border
  separation: 0.01   # must be >0 for aruco_opencv; single-marker board so value is unused
  frame_at_center: true
