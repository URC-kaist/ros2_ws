# RealSense ROS2 parameters (from official rs_launch.py defaults)
# Entries overridden for MR2 are annotated with their upstream defaults.
# https://github.com/realsenseai/realsense-ros/blob/ros2-master/realsense2_camera/launch/rs_launch.py

camera_name: 'rgbd_camera'  # default: camera
camera_namespace: '' # default: camera
serial_no: ''
usb_port_id: ''
device_type: d435i  # default: ''
config_file: ''
json_file_path: ''
initial_reset: false
accelerate_gpu_with_glsl: false
rosbag_filename: ''
rosbag_loop: false
log_level: info
output: screen

enable_color: true
rgb_camera.color_profile: 640x480x6  # default: 0,0,0
rgb_camera.color_format: RGB8
rgb_camera.enable_auto_exposure: true

enable_depth: true # enable depth stream only
enable_infra: false
enable_infra1: false
enable_infra2: false
depth_module.depth_profile: 640x480x6  # default: 0,0,0 # Disparity map
depth_module.depth_format: Z16
depth_module.infra_profile: 640x480x6  # default: 0,0,0 # Left infra cam
depth_module.infra_format: RGB8
depth_module.infra1_format: Y8
depth_module.infra2_format: Y8
depth_module.color_profile: 0,0,0
depth_module.color_format: RGB8
depth_module.exposure: 1000  # default: 8500 # NOTE: sunlight issue
depth_module.gain: 16
depth_module.hdr_enabled: false
depth_module.enable_auto_exposure: false  # default: true # NOTE: sunlight issue (non-HDR)
depth_module.exposure.1: 7500
depth_module.gain.1: 16
depth_module.exposure.2: 1
depth_module.gain.2: 16

depth_module.emitter_enabled: 0  # default: 1 # NOTE: sunlight issue ("hidden" in ros2 param list)

enable_sync: false
depth_module.inter_cam_sync_mode: 0
enable_rgbd: false

enable_gyro: true  # default: false
enable_accel: true  # default: false
enable_motion: false
gyro_fps: 0
accel_fps: 0
motion_fps: 0
unite_imu_method: 2  # default: 0

clip_distance: -2.0
angular_velocity_cov: 0.01
linear_accel_cov: 0.01

diagnostics_period: 0.0
publish_tf: true
tf_publish_rate: 0.0

pointcloud.enable: true  # default: false
pointcloud__neon_.enable: true # XXX for Jetson
pointcloud.stream_filter: 2 # (texture stream)
pointcloud__neon_.stream_filter: 2 # default: 0 # XXX for Jetson
pointcloud.stream_index_filter: 0
pointcloud.ordered_pc: false
pointcloud.allow_no_texture_points: false

align_depth.enable: true  # default: false # Creates depth map /aligned_depth_to_color/image_raw for YOLO
colorizer.enable: false
decimation_filter.enable: true
rotation_filter.enable: false
rotation_filter.rotation: 0.0
spatial_filter.enable: true  # default: false # NOTE: sunlight issue
temporal_filter.enable: true  # default: false # NOTE: sunlight issue
disparity_filter.enable: false
hole_filling_filter.enable: true # default: false # NOTE: sunlight issue
hdr_merge.enable: false

wait_for_device_timeout: -1.0
reconnect_timeout: 6.0

base_frame_id: rgbd_camera  # default: link
tf_prefix: ''
decimation_filter.filter_magnitude: 2

enable_safety: false
safety_camera.safety_mode: 0

enable_labeled_point_cloud: false
depth_mapping_camera.labeled_point_cloud_profile: 0,0,0

enable_occupancy: false
depth_mapping_camera.occupancy_profile: 0,0,0

# Custom MR2 setup (set for Korean outlet frequency)
rgb_camera.power_line_frequency: 2  # default: (not set)
