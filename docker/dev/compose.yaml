name: mr2-dev

services:
  workspace:
    image: mr2-dev:humble
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
      args:
        USER_GID: ${MR2_DEV_GID:-1000}
        USER_UID: ${MR2_DEV_UID:-1000}
    cap_add:
      - NET_ADMIN
    environment:
      BASE_XBEE_DEVICE: /tmp/xbee_sim1
      MR2_BASE_IP: 127.0.0.1
      MR2_GATEWAY_PROFILE: rover-direct
      MR2_GATEWAY_HOST: 0.0.0.0
      MR2_GATEWAY_PORT: "8081"
      MR2_ROSBRIDGE_PORT: "9090"
      MR2_ROVER_IP: 127.0.0.1
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "1"
      VITE_OPERATING_PROFILE: rover-direct
    init: true
    ipc: host
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ../..:/workspace/mr2-stack
