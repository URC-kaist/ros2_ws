<h1 id="mr2-%EC%A0%84%EC%B2%B4-%EA%B5%AC%EC%A1%B0">MR2 전체 구조</h1>
<p class="subtitle">1회차: monorepo 전체를 한 번에 보기</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="2" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%9D%B4-repo%EB%8A%94-ros-%ED%8C%A8%ED%82%A4%EC%A7%80-%ED%95%98%EB%82%98%EA%B0%80-%EC%95%84%EB%8B%88%EB%8B%A4">이 repo는 ROS 패키지 하나가 아니다</h2>
<p><code>mr2-stack</code>은 로버를 굴리는 데 필요한 여러 층을 한 repo에 같이 둔 monorepo다.</p>
<table>
<thead>
<tr>
<th>범위</th>
<th>들어있는 것</th>
</tr>
</thead>
<tbody>
<tr>
<td>web frontend</td>
<td>dashboard, map, video panel, mission UI</td>
</tr>
<tr>
<td>networking</td>
<td>nginx, TLS, WebSocket, Rocket M2, XBee</td>
</tr>
<tr>
<td>backend</td>
<td>base gateway, video gateway, status endpoints</td>
</tr>
<tr>
<td>ROS 2</td>
<td>launch, robot description, control, perception, payload</td>
</tr>
<tr>
<td>navigation</td>
<td>Nav2, localization, GNSS/RTK, map/traversability</td>
</tr>
<tr>
<td>hardware / firmware</td>
<td>CAN devices, battery firmware, base antenna Arduino</td>
</tr>
<tr>
<td>ops scripts</td>
<td>deploy, udev, CAN bringup, diagnostics</td>
</tr>
</tbody>
</table>
<p>그래서 처음 볼 때는 &quot;패키지 목록&quot;보다 &quot;어느 층의 코드인가&quot;부터 잡는 게 낫다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="3" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%98%A4%EB%8A%98-%EB%B3%BC-%EA%B2%83">오늘 볼 것</h2>
<ul>
<li>이 monorepo가 어떤 큰 덩어리들로 나뉘는지</li>
<li>브라우저에서 누른 버튼이 어디로 가는지</li>
<li>nginx, gateway, rosbridge가 각각 왜 있는지</li>
<li>XBee, video, ROS service/action이 왜 다른 길을 타는지</li>
<li>문제가 났을 때 어느 컴퓨터, 어느 프로세스부터 볼지</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%A0%84%EC%B2%B4-%EA%B7%B8%EB%A6%BC">전체 그림</h2>
<img class="diagram" src="assets/system-overview.svg" alt="전체 시스템 구조" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%8B%A4%EC%A0%9C%EB%A1%9C-%EB%96%A0-%EC%9E%88%EB%8A%94-%EA%B2%83%EB%93%A4">실제로 떠 있는 것들</h2>
<table>
<thead>
<tr>
<th>위치</th>
<th>프로세스</th>
<th>기술</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td>base</td>
<td>nginx</td>
<td>nginx/TLS</td>
<td>dashboard 정적 서빙, reverse proxy</td>
</tr>
<tr>
<td>base</td>
<td>dashboard</td>
<td>React/Vite build</td>
<td>operator UI</td>
</tr>
<tr>
<td>base</td>
<td>gateway</td>
<td>Node.js</td>
<td>XBee, video, status, antenna</td>
</tr>
<tr>
<td>rover</td>
<td>rosbridge</td>
<td>rosbridge_server</td>
<td>browser와 ROS graph 연결</td>
</tr>
<tr>
<td>rover</td>
<td>rover launch</td>
<td>ROS 2 Humble</td>
<td>control, autonomy, payload, sensors</td>
</tr>
<tr>
<td>rover/base</td>
<td>firmware</td>
<td>STM32/Arduino/device FW</td>
<td>CAN device, base antenna 등</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%9D%B4-%ED%91%9C%EB%A5%BC-%EC%9D%BD%EB%8A%94-%EB%B2%95">이 표를 읽는 법</h2>
<table>
<thead>
<tr>
<th>볼 것</th>
<th>뜻</th>
<th>이 시스템의 예</th>
</tr>
</thead>
<tbody>
<tr>
<td>누가 요청하나</td>
<td>client</td>
<td>browser dashboard</td>
</tr>
<tr>
<td>누가 기다리나</td>
<td>server/process</td>
<td>nginx, gateway, rosbridge</td>
</tr>
<tr>
<td>어느 컴퓨터인가</td>
<td>host</td>
<td>base station, rover</td>
</tr>
<tr>
<td>어느 입구인가</td>
<td>port/path</td>
<td><code>:8081</code>, <code>:9090</code>, <code>/xbee-ws</code></td>
</tr>
<tr>
<td>어디로 넘기나</td>
<td>proxy</td>
<td>nginx -&gt; gateway, nginx -&gt; rosbridge</td>
</tr>
</tbody>
</table>
<p>대부분의 연결은 이 질문으로 정리된다:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">browser가 base station nginx의 어떤 path로 붙고,
nginx가 그 요청을 어느 process로 넘기는가?
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="section" data-theme="mr2-code" lang="C" class="section" data-marpit-pagination="7" style="--paginate:true;--class:section;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h1 id="dashboard">Dashboard</h1>
<p>사람이 보는 화면. 대부분의 조작은 여기서 시작한다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="dashboard%EB%8A%94-%EC%9B%B9%EC%95%B1%EC%9D%B4%EB%8B%A4">Dashboard는 웹앱이다</h2>
<p><code>dashboard/package.json</code></p>
<table>
<thead>
<tr>
<th>영역</th>
<th>쓰는 것</th>
</tr>
</thead>
<tbody>
<tr>
<td>App framework</td>
<td>React 18 + TypeScript</td>
</tr>
<tr>
<td>Build/dev server</td>
<td>Vite</td>
</tr>
<tr>
<td>UI</td>
<td>Bootstrap, react-bootstrap, react-icons</td>
</tr>
<tr>
<td>ROS browser bridge</td>
<td>roslib</td>
</tr>
<tr>
<td>Map</td>
<td>MapLibre GL</td>
</tr>
<tr>
<td>3D</td>
<td>Three.js</td>
</tr>
<tr>
<td>Plot</td>
<td>uPlot</td>
</tr>
</tbody>
</table>
<p>빌드:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh"><span class="hljs-built_in">cd</span> dashboard
npm run build
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EC%9B%B9%EC%95%B1-%EC%AA%BD-%EA%B8%B0%EC%88%A0">웹앱 쪽 기술</h2>
<table>
<thead>
<tr>
<th>기술</th>
<th>여기서는 이렇게 보면 된다</th>
</tr>
</thead>
<tbody>
<tr>
<td>React</td>
<td>화면을 component 단위로 나눠 만드는 JavaScript UI 라이브러리</td>
</tr>
<tr>
<td>TypeScript</td>
<td>JavaScript에 타입을 붙인 언어. 메시지 모양 실수를 줄인다</td>
</tr>
<tr>
<td>Vite</td>
<td>개발 서버와 build 도구. <code>dist/</code> 정적 파일을 만든다</td>
</tr>
<tr>
<td>Bootstrap</td>
<td>버튼, 탭, 카드 같은 기본 UI 스타일</td>
</tr>
<tr>
<td>roslib</td>
<td>브라우저에서 rosbridge WebSocket에 붙는 라이브러리</td>
</tr>
</tbody>
</table>
<p>브라우저는 ROS node가 아니다. ROS와 직접 말하지 못해서 gateway나 rosbridge가 필요하다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="dashboard-%EC%BD%94%EB%93%9C-%EC%9D%BD%EB%8A%94-%EB%B2%95">Dashboard 코드 읽는 법</h2>
<table>
<thead>
<tr>
<th>보고 싶은 것</th>
<th>먼저 볼 파일</th>
</tr>
</thead>
<tbody>
<tr>
<td>화면 구성</td>
<td><code>dashboard/src/components/*</code></td>
</tr>
<tr>
<td>XBee command/telemetry</td>
<td><code>dashboard/src/lib/xbeeGateway.ts</code></td>
</tr>
<tr>
<td>ROS topic/service</td>
<td><code>dashboard/src/lib/rosBridge.ts</code></td>
</tr>
<tr>
<td>ROS action</td>
<td><code>dashboard/src/lib/rosActionBridge.ts</code></td>
</tr>
<tr>
<td>video stream</td>
<td><code>dashboard/src/lib/videoGateway.ts</code></td>
</tr>
<tr>
<td>map</td>
<td><code>dashboard/src/components/MapPreview.tsx</code></td>
</tr>
</tbody>
</table>
<p>UI bug인지, 통신 bug인지, rover 쪽 bug인지 여기서 1차로 갈린다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="dashboard%EA%B0%80-%EB%B6%99%EB%8A%94-%EC%84%B8-%EA%B0%88%EB%9E%98">Dashboard가 붙는 세 갈래</h2>
<table>
<thead>
<tr>
<th>파일</th>
<th>붙는 곳</th>
<th>path</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>src/lib/xbeeGateway.ts</code></td>
<td>base gateway command/telemetry</td>
<td><code>/xbee-ws</code></td>
</tr>
<tr>
<td><code>src/lib/videoGateway.ts</code></td>
<td>base gateway H.264 video</td>
<td><code>/video-ws</code>, <code>/video/streams</code></td>
</tr>
<tr>
<td><code>src/lib/rosBridge.ts</code></td>
<td>rover ROS graph via rosbridge</td>
<td><code>/rosbridge-ws</code></td>
</tr>
<tr>
<td><code>src/lib/rosActionBridge.ts</code></td>
<td>ROS action over rosbridge</td>
<td><code>/rosbridge-ws</code></td>
</tr>
</tbody>
</table>
<p>drive, video, ROS service가 한 통로를 쓰지 않는다. 이걸 헷갈리면 디버깅이 바로 꼬인다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%ED%99%94%EB%A9%B4-%EA%B8%B0%EB%8A%A5%EB%B3%84%EB%A1%9C-%EB%8B%A4%EB%A5%B8-%EA%B8%B8">화면 기능별로 다른 길</h2>
<table>
<thead>
<tr>
<th>화면 기능</th>
<th>지나가는 길</th>
</tr>
</thead>
<tbody>
<tr>
<td>drive / heartbeat / e-stop</td>
<td>dashboard -&gt; <code>/xbee-ws</code> -&gt; gateway -&gt; XBee -&gt; rover</td>
</tr>
<tr>
<td>battery/nav telemetry</td>
<td>rover -&gt; XBee -&gt; gateway -&gt; <code>/xbee-ws</code> -&gt; dashboard</td>
</tr>
<tr>
<td>science service / spectrometer</td>
<td>dashboard -&gt; <code>/rosbridge-ws</code> -&gt; ROS service</td>
</tr>
<tr>
<td>mission/action</td>
<td>dashboard -&gt; rosbridge action protocol -&gt; ROS action server</td>
</tr>
<tr>
<td>video panels</td>
<td>dashboard -&gt; <code>/video-ws</code> + <code>/video/streams</code> -&gt; gateway video service</td>
</tr>
<tr>
<td>map/tiles</td>
<td>dashboard -&gt; nginx <code>/tiles/</code> or external map source</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="section" data-theme="mr2-code" lang="C" class="section" data-marpit-pagination="13" style="--paginate:true;--class:section;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h1 id="nginx--deploy">nginx / Deploy</h1>
<p>브라우저 입장에서는 한 사이트지만, 뒤에서는 여러 프로세스로 나뉜다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="http-https-tls">HTTP, HTTPS, TLS</h2>
<table>
<thead>
<tr>
<th>용어</th>
<th>한 줄 설명</th>
</tr>
</thead>
<tbody>
<tr>
<td>HTTP</td>
<td>브라우저와 서버가 페이지/API를 주고받는 기본 규칙</td>
</tr>
<tr>
<td>HTTPS</td>
<td>HTTP를 암호화해서 쓰는 방식</td>
</tr>
<tr>
<td>TLS</td>
<td>HTTPS의 암호화 계층</td>
</tr>
<tr>
<td>certificate</td>
<td>&quot;이 서버가 누구인지&quot; 브라우저에 보여주는 인증서</td>
</tr>
<tr>
<td>self-signed cert</td>
<td>우리가 직접 만든 인증서. 현장 내부망에서는 실용적이다</td>
</tr>
</tbody>
</table>
<p>dashboard는 base station nginx에 HTTPS로 접속한다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="websocket">WebSocket</h2>
<p>HTTP는 보통 요청 한 번, 응답 한 번으로 끝난다.</p>
<p>WebSocket은 한 번 연결한 뒤 계속 열어둔다.</p>
<p>MR2에서 WebSocket을 쓰는 곳:</p>
<ul>
<li><code>/xbee-ws</code>: command, heartbeat, telemetry</li>
<li><code>/video-ws</code>: browser로 H.264 chunk 전달</li>
<li><code>/rosbridge-ws</code>: browser와 rover ROS graph 연결</li>
</ul>
<p>실시간성이 필요한 길은 대부분 WebSocket이다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="nginx%EA%B0%80-%ED%95%84%EC%9A%94%ED%95%9C-%EC%9D%B4%EC%9C%A0">nginx가 필요한 이유</h2>
<p>nginx가 없으면 브라우저가 여러 주소를 직접 알아야 한다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">dashboard static files
base gateway port
rover rosbridge port
tiles directory
TLS certificate
</code></pre>
<p>nginx가 있으면 브라우저는 base station 하나만 보면 된다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">https://base.local/
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EB%B0%B0%ED%8F%AC-%EC%8A%A4%ED%81%AC%EB%A6%BD%ED%8A%B8">배포 스크립트</h2>
<p><code>scripts/deploy_dashboard.bash</code></p>
<p><code>scripts/deploy_dashboard.bash</code>가 하는 일:</p>
<ul>
<li><code>.env</code>에서 base/rover/gateway/rosbridge 주소를 읽는다</li>
<li><code>dashboard</code>에서 <code>npm install</code>, <code>npm run build</code></li>
<li><code>dashboard/dist</code>를 <code>/var/www/mr2-dashboard</code>로 배포</li>
<li><code>/var/www/mr2-tiles</code> 생성</li>
<li>nginx 설치 확인</li>
<li>self-signed TLS certificate를 만든다</li>
<li>nginx config를 깔고 reload한다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="nginx-%EB%9D%BC%EC%9A%B0%ED%8C%85">nginx 라우팅</h2>
<p><code>scripts/nginx/mr2-dashboard-locations.conf</code></p>
<table>
<thead>
<tr>
<th>URL</th>
<th>어디로 보내나</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/</code></td>
<td><code>/var/www/mr2-dashboard</code> static app</td>
</tr>
<tr>
<td><code>/xbee-ws</code></td>
<td><code>mr2_gateway</code> WebSocket proxy</td>
</tr>
<tr>
<td><code>/video-ws</code></td>
<td><code>mr2_gateway</code> WebSocket proxy</td>
</tr>
<tr>
<td><code>/video/streams</code></td>
<td><code>mr2_gateway</code> HTTP proxy</td>
</tr>
<tr>
<td><code>/rocket-m2/status</code></td>
<td><code>mr2_gateway</code> HTTP proxy</td>
</tr>
<tr>
<td><code>/transitive/token</code></td>
<td><code>mr2_gateway</code> HTTP proxy</td>
</tr>
<tr>
<td><code>/rosbridge-ws</code></td>
<td><code>mr2_rover_rosbridge</code> WebSocket proxy</td>
</tr>
<tr>
<td><code>/tiles/</code></td>
<td><code>/var/www/mr2-tiles/</code> static files</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="nginx-upstream">nginx upstream</h2>
<p><code>scripts/nginx/mr2-dashboard.conf.template</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-nginx"><span class="hljs-section">upstream</span> mr2_gateway {
  <span class="hljs-attribute">server</span> __MR2_GATEWAY_HOST__:__MR2_GATEWAY_PORT__;
}

<span class="hljs-section">upstream</span> mr2_rover_rosbridge {
  <span class="hljs-attribute">server</span> __MR2_ROVER_IP__:__MR2_ROSBRIDGE_PORT__;
}
</code></pre>
<p>nginx가 base station의 입구다. gateway와 rover rosbridge를 한 HTTPS origin 뒤에 숨긴다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="section" data-theme="mr2-code" lang="C" class="section" data-marpit-pagination="20" style="--paginate:true;--class:section;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h1 id="base-gateway">Base Gateway</h1>
<p>base station에서 radio, video, antenna, dashboard를 묶는 Node.js 프로세스.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="nodejs%EB%8A%94-%EC%97%AC%EA%B8%B0%EC%84%9C-%EB%AD%98-%ED%95%98%EB%82%98">Node.js는 여기서 뭘 하나</h2>
<p>Node.js는 JavaScript를 브라우저 밖에서 실행하는 runtime이다.</p>
<p>gateway가 Node.js로 되어 있는 이유:</p>
<ul>
<li>WebSocket server 만들기 쉽다</li>
<li>serial port를 다루는 라이브러리가 있다</li>
<li>dashboard와 주고받는 JSON을 다루기 편하다</li>
<li>ROS가 없어도 base utility process로 뜰 수 있다</li>
</ul>
<p>여기서는 &quot;브라우저와 radio 사이의 중간 서버&quot;라고 보면 된다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="gateway-%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%9F%AC%EB%A6%AC-%EC%9D%B4%EB%A6%84-%EC%9D%BD%EA%B8%B0">Gateway 라이브러리 이름 읽기</h2>
<table>
<thead>
<tr>
<th>라이브러리</th>
<th>뜻</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ws</code></td>
<td>WebSocket server/client library</td>
</tr>
<tr>
<td><code>serialport</code></td>
<td><code>/dev/ttyXBEE</code>, <code>/dev/ttyARDUINO</code> 같은 serial device 접근</td>
</tr>
<tr>
<td><code>rclnodejs</code></td>
<td>Node.js에서 ROS 2 topic을 구독/발행</td>
</tr>
<tr>
<td><code>dotenv</code></td>
<td><code>.env</code> 파일에서 설정값을 읽음</td>
</tr>
</tbody>
</table>
<p><code>package.json</code>은 &quot;이 앱이 어떤 외부 기술에 기대는지&quot; 보는 첫 파일이다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="gateway%EB%8F%84-%EB%B3%84%EB%8F%84-%EC%95%B1%EC%9D%B4%EB%8B%A4">Gateway도 별도 앱이다</h2>
<p><code>base/gateway/package.json</code></p>
<table>
<thead>
<tr>
<th>기술</th>
<th>쓰는 곳</th>
</tr>
</thead>
<tbody>
<tr>
<td>Node.js CommonJS</td>
<td>gateway runtime</td>
</tr>
<tr>
<td><code>ws</code></td>
<td>dashboard WebSocket server</td>
</tr>
<tr>
<td><code>serialport</code></td>
<td>XBee serial, antenna serial</td>
</tr>
<tr>
<td><code>rclnodejs</code></td>
<td>optional base-side ROS topic relay</td>
</tr>
<tr>
<td><code>dotenv</code></td>
<td><code>.env</code>/<code>.env.local</code> config loading</td>
</tr>
</tbody>
</table>
<p>실행:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh"><span class="hljs-built_in">cd</span> base/gateway
npm start -- --base-xbee-device /dev/ttyXBEE --gateway-port 8081
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="gateway-%EC%BD%94%EB%93%9C-%EA%B5%AC%EC%A1%B0">Gateway 코드 구조</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">base/gateway/
├── index.js
├── src/app/create_gateway_app.js
├── src/runtime/
│   ├── ws_hub.js
│   ├── http_handlers.js
│   ├── serial_link.js
│   ├── ros_topic_relay.js
│   └── rocket_m2_client.js
├── src/protocol/xbee.js
├── src/video/
└── src/antenna/
</code></pre>
<p><code>create_gateway_app.js</code>에서 WebSocket, serial, video, ROS relay, Rocket M2 client를 한꺼번에 조립한다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="25" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="gateway-%EC%95%88%EC%9D%98-%EB%B6%80%ED%92%88%EB%93%A4">Gateway 안의 부품들</h2>
<table>
<thead>
<tr>
<th>하는 일</th>
<th>코드</th>
</tr>
</thead>
<tbody>
<tr>
<td>dashboard WebSocket clients</td>
<td><code>runtime/ws_hub.js</code></td>
</tr>
<tr>
<td>HTTP utility endpoints</td>
<td><code>runtime/http_handlers.js</code></td>
</tr>
<tr>
<td>XBee serial bytes</td>
<td><code>runtime/serial_link.js</code></td>
</tr>
<tr>
<td>XBee frame encode/decode</td>
<td><code>protocol/xbee.js</code></td>
</tr>
<tr>
<td>base ROS topic relay</td>
<td><code>runtime/ros_topic_relay.js</code></td>
</tr>
<tr>
<td>video stream service</td>
<td><code>video/service.js</code>, <code>video/receiver.js</code></td>
</tr>
<tr>
<td>Rocket M2 status polling</td>
<td><code>runtime/rocket_m2_client.js</code></td>
</tr>
<tr>
<td>antenna tracking</td>
<td><code>antenna/tracker.js</code>, <code>antenna/base_station.js</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="xbee-%EB%AA%85%EB%A0%B9%ED%85%94%EB%A0%88%EB%A9%94%ED%8A%B8%EB%A6%AC-%EA%B2%BD%EB%A1%9C">XBee 명령/텔레메트리 경로</h2>
<img class="diagram" src="assets/drive-command.svg" alt="XBee 명령 경로" />
<p>텔레메트리는 거의 반대 방향으로 돌아온다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="27" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="base-%EC%AA%BD-ros-relay">Base 쪽 ROS relay</h2>
<p><code>base/gateway/src/runtime/ros_topic_relay.js</code></p>
<ul>
<li>base station의 ROS topic을 dashboard 없이 XBee로 보낼 수 있다</li>
<li><code>/base/ubx_nav_svin</code>, <code>/base/rtcm</code> 같은 topic을 구독한다</li>
<li><code>BASE_SVIN</code>, <code>BASE_RTCM</code>, fragmented RTCM frame으로 인코딩한다</li>
<li>ROS가 없어도 gateway 자체는 뜰 수 있게 optional로 되어 있다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="rocket-m2-antenna-base-utility">Rocket M2, antenna, base utility</h2>
<table>
<thead>
<tr>
<th>기능</th>
<th>흐름</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rocket M2 status</td>
<td>gateway polls Rocket M2 management pages, dashboard reads <code>/rocket-m2/status</code></td>
</tr>
<tr>
<td>antenna tracker</td>
<td>base survey-in + rover nav -&gt; heading command</td>
</tr>
<tr>
<td>antenna serial</td>
<td>gateway talks to Arduino antenna controller</td>
</tr>
<tr>
<td>transitive token</td>
<td>gateway가 노출하는 작은 HTTP utility</td>
</tr>
</tbody>
</table>
<p>이건 rover ROS node는 아니지만, 현장에서는 자주 보는 base station 기능이다.</p>
</section>

<h1 id="rover-ros-2">Rover ROS 2</h1>
<p>로버 안쪽. 센서, 제어, 자율주행, payload가 ROS graph로 붙는다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="34" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="ros-2-%EA%B8%B0%EB%B3%B8-%EB%8B%A8%EC%96%B4">ROS 2 기본 단어</h2>
<table>
<thead>
<tr>
<th>용어</th>
<th>한 줄 설명</th>
</tr>
</thead>
<tbody>
<tr>
<td>node</td>
<td>ROS에서 실행되는 프로그램 단위</td>
</tr>
<tr>
<td>topic</td>
<td>계속 흘러가는 데이터. sensor, command, status에 많이 쓴다</td>
</tr>
<tr>
<td>service</td>
<td>요청 한 번, 응답 한 번. 장치 명령에 많이 쓴다</td>
</tr>
<tr>
<td>action</td>
<td>오래 걸리는 작업. goal, feedback, result가 있다</td>
</tr>
<tr>
<td>parameter</td>
<td>node 설정값</td>
</tr>
<tr>
<td>TF</td>
<td>로봇의 좌표계 관계</td>
</tr>
</tbody>
</table>
<p>ROS 쪽 디버깅은 node가 떠 있는지, topic/service/action 이름이 맞는지부터 본다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="35" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="rosbridge%EA%B0%80-%ED%95%98%EB%8A%94-%EC%9D%BC">rosbridge가 하는 일</h2>
<p>브라우저는 ROS 2 node가 아니고 DDS도 직접 쓰지 않는다.</p>
<p><code>rosbridge_server</code>는 WebSocket으로 들어온 JSON 메시지를 ROS topic, service, action 호출로 바꿔준다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">browser roslib
  &lt;-&gt; WebSocket JSON
rosbridge_server
  &lt;-&gt; ROS graph
</code></pre>
<p>dashboard에서 science service나 mission action을 누를 수 있는 이유가 이 bridge다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="36" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">

</tr>

<tr>

</tr>
<tr>

</tr>

</tbody>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="rover-%EC%AA%BD-%EC%8B%9C%EC%9E%91%EC%A0%90">Rover 쪽 시작점</h2>

<th>패키지</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>

</tr>
<tr>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="rosbridge-%EA%B2%BD%EB%A1%9C">rosbridge 경로</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">dashboard roslib

ROS graph

<h1 id="hardware--network">Hardware / Network</h1>
<p>마지막에는 radio, Ethernet, serial, CAN, camera, GNSS 같은 물리 링크가 남는다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="41" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EB%AC%BC%EB%A6%AC-%EB%A7%81%ED%81%AC%EB%A5%BC-%EC%99%9C-%EB%B4%90%EC%95%BC-%ED%95%98%EB%82%98">물리 링크를 왜 봐야 하나</h2>
<p>소프트웨어가 맞아도 실제 링크가 죽으면 아무것도 안 된다.</p>
<p>예:</p>
<ul>
<li>WebSocket은 붙었는데 XBee serial device가 없다</li>
<li>ROS service는 성공했는데 CAN 장치가 응답하지 않는다</li>
<li>video WebSocket은 열렸는데 UDP/GStreamer 입력이 없다</li>
<li>GNSS node는 떠 있는데 serial device 이름이 바뀌었다</li>
</ul>
<p>그래서 이 프로젝트는 web, ROS, hardware를 같이 봐야 한다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="42" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">

WS disconnected     -&gt; nginx route, gateway/rosbridge process, port/env
No command effect   -&gt; gateway serial, XBee link, rover bridge, controller
ROS service fails   -&gt; rosbridge, service name/type, node availability
Video missing       -&gt; stream metadata, GStreamer, /video-ws, codec config
Telemetry stale     -&gt; XBee frames, gateway decode, rover publisher
CAN failure         -&gt; SocketCAN, device package, firmware, wiring
</code></pre>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh"><span class="hljs-comment"># nginx routes</span>

<span class="hljs-comment"># dashboard clients</span>
rg <span class="hljs-string">&quot;/xbee-ws|/video-ws|/rosbridge-ws&quot;</span> dashboard/src

<h2 id="%EB%8B%A4%EC%9D%8C-%ED%9A%8C%EC%B0%A8%EB%93%A4">다음 회차들</h2>
<table>
<thead>
<tr>
<th>회차</th>
<th>주제</th>
<th>질문</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>전체 system stack</td>
<td>browser부터 hardware까지 어떤 경로를 타나?</td>
</tr>
<tr>
<td>2</td>
<td>rover description/sim/launch</td>
<td>로버 ROS graph는 어떻게 조립되나?</td>
</tr>
<tr>
<td>3</td>
<td>control/CAN/XBee</td>
<td>명령이 어떻게 하드웨어로 내려가나?</td>
</tr>
<tr>
<td>4</td>
<td>autonomy/Nav2/GNSS</td>
<td>mission이 어떻게 경로와 동작으로 바뀌나?</td>
</tr>
<tr>
<td>5</td>
<td>dashboard/gateway/ops</td>
<td>base station 운영과 UI/telemetry/video는 어떻게 고치나?</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="mr2-code" lang="C" data-marpit-pagination="53" style="--paginate:true;--theme:mr2-code;" data-marpit-pagination-total="53" data-size="16:9">
<h2 id="%EB%8B%A4%EC%9D%8C-%EC%A0%84%EA%B9%8C%EC%A7%80">다음 전까지</h2>
<p>기능 하나를 골라서 브라우저부터 rover 쪽까지 5분 안에 따라가 본다.</p>
<p>예시:</p>
<ul>
<li>drive command</li>
<li>science module command</li>
<li>spectrophotometer capture</li>
<li>mission start/pause</li>
<li>camera video panel</li>
<li>Rocket M2 status card</li>
<li>GNSS/base antenna status</li>
</ul>
<p>포함할 것:</p>
<ul>
<li>dashboard component</li>
<li>URL/path or ROS interface</li>
<li>gateway/rosbridge involvement</li>
<li>rover-side package</li>
<li>hardware or external dependency</li>
</ul>
</section>
